name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test env
        run: |
          cp apps/api/.dev.vars.example apps/api/.dev.vars
          node -e "const c=require('crypto');const fs=require('fs');const p='apps/api/.dev.vars';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace(/^TOKEN_ENC_KEY=.*/m,'TOKEN_ENC_KEY='+c.randomBytes(32).toString('base64url')))"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
